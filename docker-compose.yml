services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  gateway:
    build: ./gateway
    ports:
      - "8081:8081"
    environment:
      OPS_API_URL: http://api:8000
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - api

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      - api
